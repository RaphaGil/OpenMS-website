{{- $hero := .Site.Params.hero }}
{{- $diagramAlt := index $hero "imageAlt" | default "Animated OpenMS mass spectrometry chromatogram visualization" }}

<figure class="hero-logo-diagram" aria-label="{{ $diagramAlt }}">
  <div class="hero-logo-diagram__chart">
    <div class="hero-logo-diagram__frame">
    <svg
      class="hero-logo-diagram__svg"
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 720 260"
      role="img"
      aria-hidden="true"
      focusable="false"
    >
    <defs>
      <linearGradient id="hero-ms-spectrum-gradient" x1="0%" y1="0%" x2="100%" y2="0%">
        <stop offset="0%" stop-color="#ffb401" />
        <stop offset="22%" stop-color="#ff7501" />
        <stop offset="50%" stop-color="#ff03cb" />
        <stop offset="76%" stop-color="#b503ff" />
        <stop offset="100%" stop-color="#5280f0" />
      </linearGradient>
      <linearGradient id="hero-ms-fill-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#b503ff" stop-opacity="0.32" />
        <stop offset="55%" stop-color="#5280f0" stop-opacity="0.12" />
        <stop offset="100%" stop-color="#3157e9" stop-opacity="0" />
      </linearGradient>
      <linearGradient id="hero-ms-cursor-gradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
        <stop offset="35%" stop-color="#ffffff" stop-opacity="0.55" />
        <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
      </linearGradient>
      <filter id="hero-ms-glow" x="-30%" y="-30%" width="160%" height="160%">
        <feGaussianBlur stdDeviation="3" result="blur" />
        <feMerge>
          <feMergeNode in="blur" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <clipPath id="hero-ms-plot-clip">
        <rect x="48" y="36" width="624" height="188" rx="10" />
      </clipPath>
    </defs>

    <rect class="hero-logo-diagram__panel" x="20" y="10" width="680" height="240" rx="18" />

    <g class="hero-logo-diagram__stage" clip-path="url(#hero-ms-plot-clip)">
      <g class="hero-logo-diagram__grid" aria-hidden="true">
        <line x1="48" y1="212" x2="672" y2="212" />
        <line x1="48" y1="178" x2="672" y2="178" />
        <line x1="48" y1="144" x2="672" y2="144" />
        <line x1="48" y1="110" x2="672" y2="110" />
        <line x1="48" y1="76" x2="672" y2="76" />
      </g>

      <path
        class="hero-logo-diagram__fill"
        d="M 48 212 L 48 212 L 72 168 L 96 142 L 128 98 L 160 152 L 192 178 L 224 128 L 256 188 L 288 164 L 320 148 L 352 118 L 384 88 L 416 108 L 448 172 L 480 196 L 512 138 L 544 102 L 576 152 L 608 184 L 640 200 L 672 212 Z"
        fill="url(#hero-ms-fill-gradient)"
      />

      <g class="hero-logo-diagram__needles" filter="url(#hero-ms-glow)">
        <line class="hero-logo-diagram__needle" style="--peak-i:0" x1="72" y1="212" x2="72" y2="168" />
        <line class="hero-logo-diagram__needle" style="--peak-i:1" x1="96" y1="212" x2="96" y2="142" />
        <line class="hero-logo-diagram__needle" style="--peak-i:2" x1="128" y1="212" x2="128" y2="98" />
        <line class="hero-logo-diagram__needle" style="--peak-i:3" x1="160" y1="212" x2="160" y2="152" />
        <line class="hero-logo-diagram__needle" style="--peak-i:4" x1="192" y1="212" x2="192" y2="178" />
        <line class="hero-logo-diagram__needle" style="--peak-i:5" x1="224" y1="212" x2="224" y2="128" />
        <line class="hero-logo-diagram__needle" style="--peak-i:6" x1="256" y1="212" x2="256" y2="188" />
        <line class="hero-logo-diagram__needle" style="--peak-i:7" x1="288" y1="212" x2="288" y2="164" />
        <line class="hero-logo-diagram__needle" style="--peak-i:8" x1="320" y1="212" x2="320" y2="148" />
        <line class="hero-logo-diagram__needle" style="--peak-i:9" x1="352" y1="212" x2="352" y2="118" />
        <line class="hero-logo-diagram__needle" style="--peak-i:10" x1="384" y1="212" x2="384" y2="88" />
        <line class="hero-logo-diagram__needle" style="--peak-i:11" x1="416" y1="212" x2="416" y2="108" />
        <line class="hero-logo-diagram__needle" style="--peak-i:12" x1="448" y1="212" x2="448" y2="172" />
        <line class="hero-logo-diagram__needle" style="--peak-i:13" x1="480" y1="212" x2="480" y2="196" />
        <line class="hero-logo-diagram__needle" style="--peak-i:14" x1="512" y1="212" x2="512" y2="138" />
        <line class="hero-logo-diagram__needle" style="--peak-i:15" x1="544" y1="212" x2="544" y2="102" />
        <line class="hero-logo-diagram__needle" style="--peak-i:16" x1="576" y1="212" x2="576" y2="152" />
        <line class="hero-logo-diagram__needle" style="--peak-i:17" x1="608" y1="212" x2="608" y2="184" />
        <line class="hero-logo-diagram__needle" style="--peak-i:18" x1="640" y1="212" x2="640" y2="200" />
      </g>

      <path
        class="hero-logo-diagram__line"
        d="M 48 212 L 72 168 L 96 142 L 128 98 L 160 152 L 192 178 L 224 128 L 256 188 L 288 164 L 320 148 L 352 118 L 384 88 L 416 108 L 448 172 L 480 196 L 512 138 L 544 102 L 576 152 L 608 184 L 640 200 L 672 212"
        fill="none"
        stroke="url(#hero-ms-spectrum-gradient)"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <g class="hero-logo-diagram__markers">
        <circle class="hero-logo-diagram__marker" style="--peak-i:2" cx="128" cy="98" r="3.5" />
        <circle class="hero-logo-diagram__marker" style="--peak-i:10" cx="384" cy="88" r="4" />
        <circle class="hero-logo-diagram__marker" style="--peak-i:15" cx="544" cy="102" r="3.5" />
      </g>

      <line class="hero-logo-diagram__cursor" x1="48" y1="52" x2="48" y2="212" stroke="url(#hero-ms-cursor-gradient)" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </svg>
    <img
      class="hero-logo-diagram__wordmark"
      src="{{ "/images/logos/OpenMS-wordmark-white.svg" | relURL }}"
      alt="OpenMS"
      width="88"
      height="14"
      decoding="async"
    />
    </div>
  </div>
</figure>
