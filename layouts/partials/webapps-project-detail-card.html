{{- $project := .project -}}
<article class="webapps-project-detail-card">
  <div class="webapps-project-detail-card__main">
    {{- with $project.logo }}
    <div class="webapps-project-detail-card__logo-wrap">
      <img
        class="webapps-project-detail-card__logo{{ with $project.logoSize }} webapps-project-detail-card__logo--{{ . }}{{ end }}"
        src="{{ . | relURL }}"
        alt=""
        loading="lazy"
        decoding="async"
      />
    </div>
    {{- end }}
    <div class="webapps-project-detail-card__body">
      <h3 class="webapps-project-detail-card__name">{{ $project.name }}</h3>
      {{- with $project.description }}
      <p class="webapps-project-detail-card__text">{{ . }}</p>
      {{- end }}
      {{- with $project.maintainers }}
      <p class="webapps-project-detail-card__maintainers">
        <span class="webapps-project-detail-card__maintainers-label">Maintainers</span>
        {{ . }}
      </p>
      {{- end }}
      {{ partial "webapps-project-links.html" (dict "links" $project.links) }}
    </div>
  </div>
</article>
