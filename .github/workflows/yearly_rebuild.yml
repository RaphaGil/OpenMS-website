name: Yearly Netlify rebuild

# The footer's copyright year comes from Hugo's `now.Year`, which is fixed when
# the site is built. This asks Netlify to rebuild shortly after midnight UTC on
# 1 January so the new year shows even if nothing was merged in the meantime.
on:
  schedule:
    - cron: '5 0 1 1 *'
  workflow_dispatch: {}

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Netlify build hook
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          if [ -z "$NETLIFY_BUILD_HOOK_URL" ]; then
            echo "NETLIFY_BUILD_HOOK_URL secret is not set; skipping."
            exit 0
          fi
          curl --fail --silent --show-error -X POST -d '{}' "$NETLIFY_BUILD_HOOK_URL"
          echo "Netlify build triggered."
