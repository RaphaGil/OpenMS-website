name: Sync Google Calendar

on:
  schedule:
    # Every 15 minutes. The script only writes (and so only opens a PR /
    # redeploys) when the calendar actually changed.
    - cron: '*/15 * * * *'
  # Lets an external trigger (e.g. a Google Apps Script calendar trigger)
  # sync immediately on an event change: POST /repos/<repo>/dispatches with
  # {"event_type": "calendar-updated"}. See docs/common-tasks/update-community-calendar.md.
  repository_dispatch:
    types: [calendar-updated]
  workflow_dispatch: {}

# Never run two syncs at once — they share the update-calendar-sync branch.
concurrency:
  group: calendar-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests pyyaml icalendar

      - name: Run calendar sync script
        env:
          GOOGLE_CALENDAR_ICS_URL: ${{ secrets.GOOGLE_CALENDAR_ICS_URL }}
        run: python sync_google_calendar.py

      - name: Check for changes
        id: git-check
        run: |
          if git diff --quiet -- data/community_events.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create branch and commit
        if: steps.git-check.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b update-calendar-sync
          git add data/community_events.yaml
          git commit -m "Sync events from Google Calendar"
          git push --force https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} update-calendar-sync

      - name: Create Pull Request
        if: steps.git-check.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only an *open* PR counts — `gh pr view` also finds the previous,
          # already-merged one, which made every run after the first skip
          # creating a PR and left the fresh sync stranded on the branch.
          if [ "$(gh pr list --head update-calendar-sync --state open --json number -q length)" -gt 0 ]; then
            echo "Open PR already exists, branch updated."
          else
            gh pr create \
              --title "Automated Google Calendar sync" \
              --body "Automated update of \`data/community_events.yaml\` from the Google Calendar feed." \
              --head update-calendar-sync \
              --base main
          fi

      - name: Auto-merge Pull Request
        if: steps.git-check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub computes a brand-new PR's mergeability lazily, so an immediate
          # merge can fail with "cannot be cleanly created" — retry a few times.
          for attempt in 1 2 3 4 5; do
            if gh pr merge update-calendar-sync --squash --delete-branch; then
              exit 0
            fi
            echo "Merge attempt $attempt failed; retrying in 10s..."
            sleep 10
          done
          exit 1

      # The open PR branch (fork-main-update) keeps its own copy of the events
      # file, so its Netlify deploy preview never sees `main` changes. Mirror the
      # synced events into it after every run. Skipped when the branch does not
      # exist (e.g. upstream), and a failure here never fails the sync.
      - name: Mirror synced events into the PR branch
        if: always()
        continue-on-error: true
        run: |
          BRANCH=fork-main-update
          git fetch --no-tags origin "$BRANCH" || { echo "No $BRANCH branch; skipping."; exit 0; }
          cp data/community_events.yaml /tmp/full_events.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -f -B "$BRANCH" "origin/$BRANCH"
          python - <<'PY'
          import re
          text = open('/tmp/full_events.yaml').read()
          head, _, rest = text.partition('events:\n')
          body, tail = rest.rsplit('last_synced:', 1)
          blocks = [b for b in re.split(r'(?m)^(?=- title:)', body) if b.strip()]
          synced = [b if b.endswith('\n') else b + '\n' for b in blocks if 'synced: true' in b]
          open('data/community_events.yaml', 'w').write(head + 'events:\n' + ''.join(synced) + 'last_synced:' + tail)
          PY
          if git diff --quiet -- data/community_events.yaml; then
            echo "PR branch already up to date."
          else
            git add data/community_events.yaml
            git commit -m "Calendar: mirror synced Google Calendar events into the PR branch"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }} "HEAD:$BRANCH"
          fi
