      sponsorTiers:
        eyebrow: Sponsorship levels
        title: Foundation sponsorship levels
        intro: >-
          <span class="sponsor-lead-col">Foundation sponsorship is how organizations contribute substantially to OpenMS Inc.</span>
          <span class="sponsor-lead-col">In return, sponsors receive public acknowledgment on this site and other channels appropriate to their level—similar to tiered programs used by foundations such as the Apache Software Foundation.</span>
        note: >-
          <span class="sponsor-note-line">Contribution levels are agreed individually.</span>
          <span class="sponsor-note-line">OpenMS Inc. is a U.S. 501(c)(3) public charity; U.S.-based sponsors may be eligible for tax benefits where permitted by law.</span>
        # Tier cards show: name, price, motto, and summary. Detailed benefits are
        # configured in `benefitsMatrix` below and revealed when a card is clicked.
        # Set `showInProgram: false` to hide a tier until ready.
        # Optional `tier` on aboutPage.sponsors entries should match `id` below when grouping logos.
        levels:
          - id: bronze
            name: Bronze
            contribution: $5,000 / year
            motto: Show your support
            summary: >-
              For organizations that want to demonstrate support for open science
              and open-source software.
            showInProgram: true
          - id: silver
            name: Silver
            contribution: $10,000 / year
            motto: Partner with the community
            summary: >-
              For organizations seeking a partnership with the scientific
              open-source ecosystem.
            showInProgram: true
          - id: gold
            name: Gold
            contribution: $50,000 / year
            motto: Prominent voice in the community
            summary: >-
              For organizations investing strategically in the future of mass
              spectrometry software and education.
            showInProgram: true
          - id: platinum
            name: Platinum
            contribution: $250,000 / year
            motto: Executive Partnership
            summary: >-
              For organizations committed to shaping the future of open scientific
              infrastructure.
            showInProgram: true
        # ── Sponsorship Benefits comparison ──────────────────────────────────────
        # Rendered as an interactive breakdown under the tier cards: visitors click a
        # level (Bronze/Silver/Gold/Platinum) to reveal that tier's benefits below.
        # Each row is one benefit category. Per-tier values are a list of lines:
        #   • omit the key or use [] → shows an em dash (not included)
        #   • use ["✓"]             → shows a check mark (included, no extra detail)
        #   • otherwise             → each list item is shown as a line of text
        # Tier keys must match the `id`s in `levels` above.
        benefitsTitle: Benefit comparison
        featuredLevel: gold
        taxFootnote: "*where applicable by law"
        benefitsMatrix:
          - category: Annual Developer Retreat perks
            bronze: []
            silver:
              - 1 discounted registration pass (20% off)
            gold:
              - 1 free registration pass
              - Opportunity to host a technical session, workshop, or case study presentation
            platinum:
              - 3 free registration passes
              - Opportunity to host a technical session, workshop, or case study presentation
          - category: Logo placement
            bronze:
              - Website
            silver:
              - Website & presentations
            gold:
              - Website & presentations
            platinum:
              - Prominent placement on website, presentations & social media
          - category: Named recognition
            bronze:
              - Sponsorship listings, community communications
            silver:
              - Sponsorship listings, community communications, annual reports
            gold:
              - Sponsorship listings, community communications, annual reports
            platinum:
              - Sponsorship listings, announcements & strategic partnership recognition on website & social media
          - category: Dedicated engagement meeting
            bronze: []
            silver: []
            gold: []
            platinum: ["✓"]
          - category: Sponsorship opportunity for roadmap and executive initiatives
            bronze: []
            silver: ["✓"]
            gold: ["✓"]
            platinum: ["✓"]
          - category: Permission to display OpenMS supporter badge
            bronze: ["✓"]
            silver: ["✓"]
            gold: ["✓"]
            platinum: ["✓"]
          - category: Tax-deductible*
            bronze: ["✓"]
            silver: ["✓"]
            gold: ["✓"]
            platinum: ["✓"]
